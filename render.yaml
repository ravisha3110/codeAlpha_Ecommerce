databases:
  - name: luxe-db
    databaseName: luxedb
    user: luxeuser
    plan: free

services:
  - type: web
    name: luxe-web
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn ecommerce.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: luxe-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: PYTHON_VERSION
        value: 3.10.12
